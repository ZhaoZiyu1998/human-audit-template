<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Human audit template</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1 id="title">Human audit template</h1>
      <div id="instruction" class="instruction"></div>
    </div>
    <div id="progress" class="progress"></div>
    <input id="reviewer" class="reviewer" type="text" placeholder="Reviewer name or ID">
    <button id="export" class="button" type="button">Export JSONL</button>
  </header>
  <div class="layout">
    <nav class="queue" aria-label="Audit items">
      <div id="item-list" class="item-list"></div>
    </nav>
    <main id="item" class="content"></main>
    <aside class="form-panel">
      <form id="questions" onsubmit="return false"></form>
      <div class="actions">
        <button id="save" class="button primary" type="button">Save response</button>
        <button id="next" class="button" type="button">Next item</button>
      </div>
      <div id="status" class="status" aria-live="polite"></div>
    </aside>
  </div>
  <script src="audit_config.js"></script>
  <script src="audit_items.js"></script>
  <script src="audit_app.js"></script>
</body>
</html>
